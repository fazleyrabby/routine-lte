services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routine-lte-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      - mysql
      - redis
    networks:
      - routine-lte

  mysql:
    image: mysql:8.0
    container_name: routine-lte-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-routine}
      MYSQL_USER: ${DB_USERNAME:-routine}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - routine-lte

  redis:
    image: redis:7-alpine
    container_name: routine-lte-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - routine-lte

volumes:
  mysql_data:
  redis_data:

networks:
  routine-lte:
    driver: bridge
